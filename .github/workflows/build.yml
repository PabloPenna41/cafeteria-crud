name: Build Windows EXE

on:
  push:
    branches: [main]
    paths: ["app.py", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller requests
      - run: pyinstaller --onefile --windowed --name CafeteriaApp app.py
      - name: Commit exe na pasta windows/
        shell: bash
        run: |
          mkdir -p windows
          cp dist/CafeteriaApp.exe windows/CafeteriaApp.exe
          cp servidor.txt windows/servidor.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add windows
          git commit -m "Atualiza CafeteriaApp.exe [skip ci]" || echo "sem mudancas"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: CafeteriaApp
          path: |
            dist/CafeteriaApp.exe
            servidor.txt
